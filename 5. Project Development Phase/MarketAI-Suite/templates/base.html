<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarketAI Suite — AI-Powered Sales & Marketing Intelligence Platform">
    <title>{% block title %}MarketAI Suite{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">🤖</span>
                <span class="brand-text">MarketAI <span class="brand-accent">Suite</span></span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">📊 Dashboard</a></li>
                <li><a href="/campaign" class="nav-link {% if request.path == '/campaign' %}active{% endif %}">🎯 Campaign</a></li>
                <li><a href="/sales-pitch" class="nav-link {% if request.path == '/sales-pitch' %}active{% endif %}">💼 Sales Pitch</a></li>
                <li><a href="/lead-scoring" class="nav-link {% if request.path == '/lead-scoring' %}active{% endif %}">📈 Leads</a></li>
                <li><a href="/segmentation" class="nav-link {% if request.path == '/segmentation' %}active{% endif %}">👥 Segments</a></li>
                <li><a href="/strategy" class="nav-link {% if request.path == '/strategy' %}active{% endif %}">🗺️ Strategy</a></li>
                <li><a href="/history" class="nav-link {% if request.path == '/history' %}active{% endif %}">🕐 History</a></li>
                <li><a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">⚙️ Settings</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
